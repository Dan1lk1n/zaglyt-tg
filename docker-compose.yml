services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_NAME: ${BOT_NAME}
      DEVELOPERS: ${DEVELOPERS}
      # Single connection string. Overrides the individual DB_* variables.
      DATABASE_URL: ${DATABASE_URL:-postgres://${DB_USER:-zaglyt}:${DB_PASSWORD:-zaglyt}@db:5432/${DB_NAME:-zaglyt}?sslmode=disable}
      # Update mode: polling (default) or webhook. See .example-env for details.
      BOT_MODE: ${BOT_MODE:-polling}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_LISTEN_ADDR: ${WEBHOOK_LISTEN_ADDR:-:8080}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/webhook}
      WEBHOOK_IP_ALLOWLIST_ENABLED: ${WEBHOOK_IP_ALLOWLIST_ENABLED:-true}
      # Local LLM that picks/rewrites Markov replies. Set LLM_URL="" to disable;
      # the bot also falls back to Markov whenever the LLM is down or slow.
      LLM_URL: ${LLM_URL-http://llm:8080}
      LLM_SYSTEM_PROMPT: ${LLM_SYSTEM_PROMPT:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      # Reply length cap in tokens (~80 tokens ≈ 250 chars of Russian).
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-80}
      LLM_MAX_PROMPT_CHARS: ${LLM_MAX_PROMPT_CHARS:-2500}
      LLM_CONTEXT_MESSAGES: ${LLM_CONTEXT_MESSAGES:-15}
      # Chat member profiles. Mount the file (e.g. a Dokploy file mount) and
      # point this at it, e.g. /app/personas.json. Empty = no profiles.
      LLM_PERSONAS_FILE: ${LLM_PERSONAS_FILE:-}
      # Simultaneous LLM requests; when all are busy the bot answers with
      # Markov right away instead of queueing.
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
      # Updates processed in parallel, so one slow reply doesn't block the chat.
      BOT_WORKERS: ${BOT_WORKERS:-8}
    # Published for webhook mode (harmless in polling mode). The container
    # listens on 8080 by default; keep WEBHOOK_LISTEN_ADDR=":8080" to match.
    ports:
      - "8080:8080"
    volumes:
      # Persist per-channel message files across restarts
      - messages:/app/database/messages
    healthcheck:
      # Only meaningful in webhook mode; passes trivially otherwise.
      test: ["CMD-SHELL", "[ \"$$BOT_MODE\" != webhook ] || wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qwen2.5-7B-Instruct-abliterated-v2 (Q4_K_M, ~4.7 GB, ~3.5 GB RAM) served by llama.cpp.
  # Memory is bounded on three levels:
  #   - fixed context window (-c): the KV cache never grows past it; the bot
  #     trims old chat messages so every prompt fits (LLM_MAX_PROMPT_CHARS);
  #   - --cache-ram 0: no host-side prompt cache (llama.cpp default is 8 GB!);
  #   - mem_limit: hard cgroup cap, the container is OOM-killed and restarted
  #     rather than eating the host's RAM.
  # Optional: started only with COMPOSE_PROFILES=llm. It can also be stopped
  # any time (docker compose stop llm); the bot then replies with Markov only.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    restart: unless-stopped
    command:
      # Any GGUF from HuggingFace that fits LLM_MEM_LIMIT can be swapped in.
      - --hf-repo
      - ${LLM_HF_REPO:-QuantFactory/Qwen2.5-7B-Instruct-abliterated-v2-GGUF}
      - --hf-file
      - ${LLM_HF_FILE:-Qwen2.5-7B-Instruct-abliterated-v2.Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${LLM_CTX_SIZE:-4096}"
      - --parallel
      - "1"
      - --batch-size
      - "256"
      - --ubatch-size
      - "256"
      - --cache-ram
      - "0"
      - --threads
      - "${LLM_THREADS:-2}"
      # No hidden "thinking" for models that support it (e.g. Qwen3).
      - --reasoning
      - "off"
      - --no-webui
    volumes:
      # Downloaded model weights, so restarts don't re-download the model.
      - llm-models:/root/.cache
    mem_limit: ${LLM_MEM_LIMIT:-5g}
    memswap_limit: ${LLM_MEM_LIMIT:-5g}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-zaglyt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zaglyt}
      POSTGRES_DB: ${DB_NAME:-zaglyt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zaglyt} -d ${DB_NAME:-zaglyt}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  llm-models:
  messages:
  pgdata:
